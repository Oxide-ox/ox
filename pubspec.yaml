name: xxo25
description: "Oxide App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # --- Audio & Media ---
  just_audio: ^0.9.39
  audio_service: ^0.18.15 # 👈 WAJIB ADA agar music_service.dart tidak error
  audioplayers: ^6.6.0
  youtube_player_flutter: ^9.1.1
  youtube_player_iframe: ^5.2.1
  video_player: ^2.9.2
  chewie: ^1.5.2

  # --- Networking & API ---
  http: ^1.6.0
  dio: ^5.7.0
  web_socket_channel: ^2.4.0
  network_info_plus: ^4.1.0
  webview_flutter: ^4.8.0

  # --- UI & Utilities ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.10.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.68.0
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # --- Storage & Device ---
  shared_preferences: ^2.2.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.0
  device_info_plus: ^10.1.0
  image_picker: ^1.0.7
  flutter_downloader: ^1.11.8
  gallery_saver_plus: ^3.2.9
  share_plus: ^7.0.1
  url_launcher: ^6.2.6
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/icon.jpg
  image_path_ios: assets/icon/icon/icon.jpg
  image_path: assets/icon/icon.jpg
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
    - assets/images/logo.png
    - assets/images/logoo.png
    - assets/images/login.png
    - assets/videos/splash.mp4
    - assets/videos/banner.mp4

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/x.ttf
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
